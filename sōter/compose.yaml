services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file: .env
    command: ["uvicorn", "secure.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["scan-data:/data/scans"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file: .env
    command: ["celery", "-A", "secure.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      zap: {condition: service_started}
    volumes: ["scan-data:/data/scans"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: secure
      POSTGRES_USER: secure
      POSTGRES_PASSWORD: secure
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure -d secure"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [default]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    pids_limit: 128
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:13ab209749089466efa208c38c0f7984cd80c44e66af46c93baec4193aec2496
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=false", "-config", "api.key=${ZAP_API_KEY}", "-config", "api.addrs.addr.name=worker", "-config", "api.addrs.addr.regex=false"]
    volumes: ["scan-data:/scan-work"]
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

volumes:
  postgres-data:
  scan-data:
