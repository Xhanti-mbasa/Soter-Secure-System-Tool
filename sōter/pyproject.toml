[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.5",
  "celery[redis]==5.5.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.2",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0", "ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["secure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
